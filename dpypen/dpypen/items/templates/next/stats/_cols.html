{% load l10n %}<div class="bars is-plain">{% for b in rows %}<button type="button" class="bar-col" data-tip-title="{{ b.title }}" data-tip-lead="{{ b.n }}{{ unit }}" aria-label="{{ b.title }}, {{ b.n }}{{ unit }}"><span class="bar-plot" style="--h: {{ b.pct|unlocalize }}">{% if show_n and b.n %}<span class="bar-n">{{ b.n }}</span>{% endif %}<span class="bar-stack"><i></i></span></span><span class="bar-label">{{ b.label }}</span></button>{% endfor %}</div>
