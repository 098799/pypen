<script>
/* On each full load and after each htmx swap: the messages not yet shown.
   The kit shows one toast at a time, so several messages at once (a notebook
   import: a warning per bad row, then "Saved n inkings") become one toast,
   joined in order: none is lost, and a failure among them makes it kind "bad".
   A box with an Undo is the kit's (confirm.html): its form[data-undo] carries
   all the words (_msgs.html), the kit shows it and Undo submits the form. */
(function () {
  if (window.__kitMsgs) return;
  window.__kitMsgs = true;
  function read() {
    document.querySelectorAll("[data-kit-msgs]:not([data-done])").forEach(function (box) {
      box.setAttribute("data-done", "");
      if (box.querySelector("form[data-undo]")) return;
      var words = [], bad = false;
      box.querySelectorAll("[data-msg]").forEach(function (m) {
        var t = (m.querySelector("[data-text]").textContent || "").trim();
        if (t) words.push(t);
        if (m.hasAttribute("data-bad")) bad = true;
      });
      if (words.length) kitToast(words.join(" "), {kind: bad ? "bad" : null});
    });
  }
  /* An hx-boost swap is pypen's soft navigation: the kit offers a new page's
     form[data-undo] at load and at kit:softnav, so say it when one came. */
  function swapped() {
    read();
    if (document.querySelector("form[data-undo]:not([data-undo-shown])"))
      document.dispatchEvent(new CustomEvent("kit:softnav"));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", read);
  else read();
  document.addEventListener("htmx:afterSettle", swapped);
  /* The Undo's form sits in #main; a boosted swap would take it out while its
     toast still shows (a form out of the page submits nothing): keep the last
     one, hidden, in <body>. */
  document.addEventListener("htmx:beforeSwap", function (e) {
    var t = e.detail && e.detail.target;
    if (!t || t.id !== "main") return;
    var f = t.querySelector("form[data-undo-shown]");
    if (!f) return;
    document.querySelectorAll("body > form[data-undo-kept]").forEach(function (n) { n.remove(); });
    f.hidden = true;
    f.setAttribute("data-undo-kept", "");
    document.body.appendChild(f);
  });
  /* Back/forward from htmx's history cache rewrites <body> from a snapshot
     that holds a copy of #kit-toast: drop the copy (the kit re-attaches its
     own element at the next toast). */
  document.addEventListener("htmx:historyRestore", function () {
    document.querySelectorAll("#kit-toast").forEach(function (n) { n.remove(); });
    read();
  });
})();
</script>
<script>
/* htmx swaps no 4xx or 5xx answer, so a boosted link to a page that is not
   there did nothing at all. The error pages (items/error_pages.py) are pages
   with a #main: take them for a boosted navigation, as a load would. A fetch
   of a fragment keeps htmx's way (its answer is JSON or a partial). */
document.addEventListener("htmx:beforeSwap", function (e) {
  var d = e.detail, x = d.xhr;
  if (!d.boosted || !x || x.status < 400) return;
  if (!/text\/html/.test(x.getResponseHeader("Content-Type") || "")) return;
  if (x.responseText.indexOf('id="main"') < 0) return;
  d.shouldSwap = true;
  d.isError = false;
});
</script>
<script>
/* A live search or a chip (pens, inks, inkings, /search/) that gets a 5xx or
   no answer at all: htmx swaps nothing, so the old rows stayed as if they
   were the answer. Put the kit's "could not load" block in the target
   instead, with Try again (the same GET again). Boosted page loads keep the
   handler above; a POST is never repeated from here. */
(function () {
  if (window.__pypenSwapFail) return;
  window.__pypenSwapFail = true;
  function failed(e) {
    var d = e.detail || {}, t = d.target, elt = d.elt, cfg = d.requestConfig || {};
    if (!window.kitEmpty || !t || !elt || d.boosted || t.id === "main") return;
    if (String(cfg.verb || "get").toLowerCase() !== "get") return;
    var url = (d.pathInfo && d.pathInfo.finalRequestPath) || cfg.path;
    var sel = elt.closest("[hx-select]");
    kitEmpty.fail(t, d.xhr && d.xhr.status ? d.xhr : {name: "TypeError"}, function () {
      htmx.ajax("GET", url, {source: elt, target: t, swap: "outerHTML",
                             select: sel ? sel.getAttribute("hx-select") : undefined});
    });
  }
  document.addEventListener("htmx:responseError", failed);
  document.addEventListener("htmx:sendError", failed);
})();
</script>
<script>
/* A POST form (the kit's busy button, README §4 "Busy"; every POST form carries
   data-kit-busy). The kit's markup waits for a page load, but hx-boost sends
   the form itself (the submit is defaultPrevented), so here the button waits
   on htmx's request instead: a ring in its label, a second tap or Enter sends
   nothing (htmx would queue it and post twice), 20 s, then htmx's request is
   aborted. No answer at all, or a refusal htmx swaps nothing for, is the kit's
   toast "Not sent — …"; an error page swaps in (the handler above) and says it.
   A form whose answer is a picture being made (data-busy-on-submit: Polish,
   Lift the ink, Clean up) has no time limit and veils its tile (.is-busy, or
   the element the value names) while it runs; the veil goes with the answer,
   whatever it was. A form with hx-boost="false" is the kit's own markup case. */
(function () {
  if (window.__pypenBusy) return;
  window.__pypenBusy = true;
  function veilOf(f) {
    if (!f.hasAttribute("data-busy-on-submit")) return null;
    var sel = f.getAttribute("data-busy-on-submit");
    return (sel && document.querySelector(sel)) || f.closest("[data-busy-host]");
  }
  /* The kit guards a busy button; a form with none (a photo picker that
     sends itself) is busy as a whole: a second pick while it uploads sends
     nothing (htmx queued it: the photos were added twice). */
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f && f.hasAttribute && f.hasAttribute("data-kit-busy") && window.kitBusy && kitBusy.is(f)) {
      e.preventDefault(); e.stopImmediatePropagation();
    }
  }, true);
  document.addEventListener("htmx:beforeRequest", function (e) {
    var d = e.detail || {}, f = d.elt, cfg = d.requestConfig || {};
    if (!window.kitBusy || !f || f.tagName !== "FORM" || !f.hasAttribute("data-kit-busy")) return;
    if (String(cfg.verb || "get").toLowerCase() === "get") return;
    var ev = cfg.triggeringEvent, by = ev && ev.submitter && ev.submitter.form === f ? ev.submitter : f;
    var veil = veilOf(f), long = !!veil || /multipart/i.test(f.enctype || "");
    if (veil) veil.classList.add("is-busy");
    kitBusy(by, function (signal) {
      return new Promise(function (ok, no) {
        function end(x) {
          f.removeEventListener("htmx:afterRequest", end);
          if (veil) veil.classList.remove("is-busy");
          var r = x.detail || {}, st = r.xhr ? r.xhr.status : 0;
          if (r.successful) return ok();
          var err = st ? new Error("HTTP " + st) : new TypeError("no answer");
          if (st) err.status = st;
          no(err);
        }
        f.addEventListener("htmx:afterRequest", end);
        if (signal) signal.addEventListener("abort", function () { if (window.htmx) htmx.trigger(f, "htmx:abort"); });
      });
    }, {text: f.getAttribute("data-kit-busy") || null, fail: "Not sent", timeout: long ? 0 : 20000});
  });
  /* htmx keeps a copy of the page for Back before it swaps the answer in,
     while the button still waits: free it first, or Back brings a button
     the kit no longer knows (dead for ever). The same for the bfcache. */
  function free() {
    if (window.kitBusy) document.querySelectorAll(".kit-busy").forEach(function (b) { kitBusy.off(b); });
    document.querySelectorAll(".is-busy").forEach(function (v) { v.classList.remove("is-busy"); });
  }
  document.addEventListener("htmx:beforeHistorySave", free);
  window.addEventListener("pageshow", function (e) { if (e.persisted) free(); });
})();
</script>
