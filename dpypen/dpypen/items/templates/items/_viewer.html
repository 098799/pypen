<!-- KIT-VIEWER: v1.0 2026-11-14
  A picture full screen: tap it and it fills the screen, to be pinched, zoomed,
  walked through and closed — the same in every app. Spec: ~/apps/kit/README.md
  §4, "Picture viewer". Canonical copy: ~/apps/kit/snippets/viewer.html. Apps
  carry a byte-identical copy (fleet-check `kit` compares them): change this
  file, bump the stamp here and in `version` below, copy it out. Never edit a
  copy.

  Why a piece of our own: 9 apps had their own (AUDIT.md, 2026-11-14, ~3,500
  lines, 4 markup schemes): the picture's alt was empty in all 9, a late file
  landed under the next caption in 3, a pinch zoomed the whole page in 2, a
  resize threw the zoom away in 6, and one app's `data-zoom` also named a
  chart's zoom chips (a tap on "2×" opened a black viewer on "2").

  Include it once in <body>, after layer.js (kitLayer: Back, focus) and before
  the scripts that call it (or bundle it through shell.py). It builds its
  <dialog id="kit-viewer"> on the first open.

  Markup, no script needed (pages swapped in later included):
    <a href="/m/full.jpg" data-view data-view-group="post-7"><img src="/t/small.jpg" alt="…"></a>
    <img src="/t/small.jpg" data-view="/m/full.jpg" data-view-cap="Kyoto, 2019" alt="…">
      data-view="url"        the file to show; empty: the link's href, else the
                             picture's own src. The picture already on the page
                             goes up at once; the file replaces it, view kept.
      data-view-group="g"    every [data-view][data-view-group="g"] on the page,
                             in page order, is one set to walk.
      data-view-of="g"       this one opens set g without being in it (a big
                             photo over its thumbnails): at the member marked
                             aria-current or .active, else at the same file.
      data-view-cap="…"      the caption (also the picture's alt, else its img alt)
      data-view-w / -h       the file's size in px: laid out before it loads
      data-view-hi="url"     a sharper file, fetched only when zoomed in
      data-view-src2="url"   tried when the file fails (a smaller copy)
      data-view-orig="url"   "Open the original ↗" when nothing loads
      data-view-video="url"  a video (data-view-poster="url"): plays, no zoom
      data-view-total="647"  the count of a paged list ("3 of 647")
    A link with data-view keeps its href: a click with a modifier key, a middle
    click, or no script at all opens the file. An element that is not a link or
    a button gets tabindex and role=button here, and opens on Enter or Space.
    A click another script already took (defaultPrevented) is left alone.

  Script:
    var v = kitViewer.open(items, {at: 2, …})   items: [{src, thumb, cap, alt,
            w, h, hi, src2, orig, video, poster}] or elements as above; a string
            is {src}. cap may be a function(item) → text or Promise of text.
    kitViewer.setup({…})       options for the markup opens (any of below)
    kitViewer.close() · kitViewer.isOpen() · kitViewer.current() → v or null
  Options:
    at        the index to open at (0)
    total     the count shown when the list is a page of more
    onShow    function(item, i, v): each time a picture becomes the current one
    onClose   function(i, why): after it went (why as in kitLayer)
    onEnded   function(v): a video ended (igarchive: the next story)
    actions   [{label, icon, run(item, i, v), when(item)}]: ≤ 3 buttons in the
              top bar, icon = the app's own SVG markup (never a user's text)
    info      function(item, el, v): fills el under the caption on each show
    autoplay  true: a video plays when it becomes the current one
    upscale   false: a small picture is never drawn larger than its pixels
    loop      true: the last walks on to the first
    keys      false: no keys of its own but Esc (a baby-tier app)
    name      kitLayer's name ("picture")
  v (also given to the hooks): v.index, v.item, v.items, v.go(i), v.step(±1),
    v.close(), v.zoom(factor), v.pan(dx, dy), v.fit(), v.over (an element over
    the current picture, transformed with it: a before/after overlay; cleared
    on each show; stop pointerdown there to keep a drag of your own),
    v.bar (the top bar, for an app's own control), v.retry().
  Labels: window.KITVIEWER = {labels: {close, prev, next, of, picture, loading,
    failed, small, retry, original, sharp, touch, desk, view}} before it loads.

  What it does: a top-layer <dialog>, fixed dark in both themes (a picture is
  seen on black), opened through kitLayer (Back, Esc, focus back to the
  picture). Three slides: the picture follows the finger sideways and the next
  one comes in; past 18 % or a flick it steps, else it springs back; a rubber
  band at the ends. A pull down follows the finger and closes past 110 px. Pinch,
  double tap (2.8× at the finger), the wheel (by its size; ctrl = trackpad
  pinch), + − 0 z. Zoomed: one finger pans, with momentum; ← → ↑ ↓ pan; Esc goes
  back to fit first; an overview map shows where you are. A tall screenshot
  rests at reading width from its top. A single tap shows or hides the bars; a
  tap beside the picture closes. The caption and the counter change with the
  picture, never after it; a file that comes late for a picture already left
  is dropped. Nothing after 0.4 s: a ring; nothing at all: "The picture did not
  load" + Try again (+ the original); only the small copy: says so. A resize
  keeps the zoom. Reduced motion: no glides.
-->
<style>
#kit-viewer { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: #f2f2f2; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: normal; text-transform: none; outline: none; }
#kit-viewer::backdrop { background: transparent; }
#kit-viewer .kv-bg { position: absolute; inset: 0; background: #000; }
#kit-viewer .kv-slide { position: absolute; inset: 0; will-change: transform; }
#kit-viewer .kv-pic { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; transition: opacity .15s; }
#kit-viewer .kv-pic.on { opacity: 1; }
#kit-viewer .kv-pic > img, #kit-viewer .kv-pic > video { display: block; width: 100%; height: 100%; max-width: none; border: 0; border-radius: 0; background: transparent; -webkit-user-drag: none; }
#kit-viewer .kv-over { position: absolute; inset: 0; }
#kit-viewer .kv-over:empty { display: none; }
#kit-viewer .kv-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top, 0px) + 6px) 8px 14px 16px; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); transition: opacity .2s; }
#kit-viewer .kv-n { flex: 1; min-width: 0; font-size: 14px; font-variant-numeric: tabular-nums; color: rgba(242,242,242,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#kit-viewer .kv-b { flex: none; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(28,28,28,.6); color: #f2f2f2; display: inline-grid; place-items: center; cursor: pointer; font: inherit; box-shadow: none; text-decoration: none; }
#kit-viewer .kv-b:hover { background: rgba(60,60,60,.75); }

#kit-viewer .kv-b:focus-visible, #kit-viewer .kv-msg button:focus-visible, #kit-viewer .kv-msg a:focus-visible { outline: 2px solid var(--accent, #8ab4f8); outline-offset: 2px; }
#kit-viewer .kv-step { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; display: none; transition: opacity .2s; }
#kit-viewer .kv-prev { left: 10px; }
#kit-viewer .kv-next { right: 10px; }
@media (hover: hover) and (pointer: fine) { #kit-viewer .kv-step { display: inline-grid; } }
#kit-viewer .kv-step[hidden], #kit-viewer.kv-zoomed .kv-step { display: none; }
#kit-viewer .kv-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.65)); transition: opacity .2s; }
#kit-viewer .kv-foot.none { display: none; }
#kit-viewer .kv-cap { max-width: 68ch; margin: 0 auto; font-size: 14.5px; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; cursor: default; }
#kit-viewer .kv-cap.open { -webkit-line-clamp: unset; max-height: 40vh; overflow: auto; }
#kit-viewer .kv-cap:empty { display: none; }
#kit-viewer .kv-info { max-width: 68ch; margin: 6px auto 0; }
#kit-viewer .kv-info:empty { display: none; }
#kit-viewer.kv-bare .kv-bar, #kit-viewer.kv-bare .kv-foot, #kit-viewer.kv-bare .kv-step { opacity: 0; pointer-events: none; }
#kit-viewer.kv-zoomed .kv-foot { opacity: 0; pointer-events: none; }
#kit-viewer .kv-msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max-content; max-width: min(320px, 86vw); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; font-size: 15px; pointer-events: none; }
#kit-viewer .kv-msg[hidden] { display: none; }
#kit-viewer .kv-msg.low { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); background: rgba(28,28,28,.85); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; }
#kit-viewer .kv-msg.pill { top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); background: rgba(28,28,28,.85); padding: 6px 12px; border-radius: 16px; font-size: 13px; }
#kit-viewer .kv-msg button, #kit-viewer .kv-msg a { pointer-events: auto; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid rgba(242,242,242,.5); background: rgba(28,28,28,.6); color: #f2f2f2; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
#kit-viewer .kv-msg .kv-acts2 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
#kit-viewer .kv-msg .kv-acts2:empty { display: none; }
#kit-viewer .kv-ring { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(242,242,242,.25); border-top-color: #f2f2f2; animation: kv-spin .8s linear infinite; }
#kit-viewer .kv-msg.pill .kv-ring, #kit-viewer .kv-msg.low .kv-ring, #kit-viewer .kv-msg.bad .kv-ring { display: none; }
@keyframes kv-spin { to { transform: rotate(360deg); } }
#kit-viewer .kv-map { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); overflow: hidden; background: #111; outline: 1px solid rgba(242,242,242,.5); opacity: 0; transition: opacity .3s; pointer-events: none; }
#kit-viewer .kv-map.on { opacity: 1; }
#kit-viewer .kv-map img { display: block; width: 100%; height: 100%; max-width: none; }
#kit-viewer .kv-map i { position: absolute; outline: 2px solid #fff; box-shadow: 0 0 0 999px rgba(0,0,0,.45); }
#kit-viewer .kv-hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); max-width: 92vw; background: rgba(28,28,28,.85); padding: 8px 14px; border-radius: 18px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; }
#kit-viewer .kv-hint.on { opacity: 1; }
#kit-viewer .kv-hint .kv-desk { display: none; }
@media (hover: hover) and (pointer: fine) { #kit-viewer .kv-hint .kv-touch { display: none; } #kit-viewer .kv-hint .kv-desk { display: inline; } }
@media (prefers-reduced-motion: reduce) { #kit-viewer .kv-pic, #kit-viewer .kv-bar, #kit-viewer .kv-foot, #kit-viewer .kv-hint, #kit-viewer .kv-map { transition: none; } }
[data-view]:not(a):not(button) { cursor: zoom-in; }
</style>
<script>
(function () {
  if (window.kitViewer && window.kitViewer.version) return;
  var VERSION = '1.0';
  var GAP = 16, MAXZ = 6, TAP_MS = 300, TAP_PX = 30, DOUBLE = 2.8;
  var CFG = window.KITVIEWER || {};
  var L = {
    close: 'Close', prev: 'Previous picture', next: 'Next picture', of: ' of ', picture: 'Picture',
    loading: 'Loading…', failed: 'The picture did not load.', small: 'The full picture did not load — this is the small copy.',
    retry: 'Try again', original: 'Open the original ↗', sharp: 'Loading the sharp picture…',
    touch: 'Pinch or double-tap to zoom · swipe down to close', desk: 'Scroll or double-click to zoom · ← → next · Esc to close',
    view: 'View full screen'
  };
  var k;
  for (k in (CFG.labels || {})) L[k] = CFG.labels[k];
  var ICON = {
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
  };
  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var dlg, bg, bar, countEl, actsEl, xBtn, prevBtn, nextBtn, foot, capEl, infoEl, msgEl, msgText, msgActs, mapEl, mapImg, mapBox, hintEl;
  var slides = [];         // three: [previous, current, next]
  var S = null;            // the open session: {items, i, o}
  var defaults = {};
  var dragX = 0, anim = 0, stepping = null, capTimer = 0, msgTimer = 0, hintTimer = 0, mapTimer = 0, tapTimer = 0;
  var pointers = new Map(), g = null, lastTap = null, momentum = 0, viaLayer = false;
  var closing = false, queued = null;    // a close waiting for its history pop; an open asked meanwhile

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html) e.innerHTML = html;
    return e;
  }
  function W() { return dlg.clientWidth || innerWidth; }
  function H() { return dlg.clientHeight || innerHeight; }
  function now() { return performance.now(); }
  function cur() { return slides[1]; }

  // ——— build, once ———
  function build() {
    if (dlg && dlg.isConnected) return;
    dlg = document.getElementById('kit-viewer');
    if (!dlg) { dlg = el('dialog'); dlg.id = 'kit-viewer'; document.body.appendChild(dlg); }
    dlg.setAttribute('aria-label', L.picture);
    dlg.innerHTML = '';
    bg = dlg.appendChild(el('div', 'kv-bg'));
    slides = [0, 1, 2].map(function () {
      var s = {el: el('div', 'kv-slide'), box: el('div', 'kv-pic'), idx: -1, gen: 0};
      s.over = el('div', 'kv-over');
      s.el.appendChild(s.box);
      dlg.appendChild(s.el);
      return s;
    });
    bar = dlg.appendChild(el('div', 'kv-bar'));
    countEl = bar.appendChild(el('span', 'kv-n'));
    countEl.setAttribute('aria-live', 'polite');
    actsEl = bar.appendChild(el('span', 'kv-acts'));
    actsEl.style.display = 'contents';
    xBtn = bar.appendChild(el('button', 'kv-b kv-x', ICON.x));
    xBtn.type = 'button'; xBtn.setAttribute('aria-label', L.close);
    prevBtn = dlg.appendChild(el('button', 'kv-b kv-step kv-prev', ICON.prev));
    nextBtn = dlg.appendChild(el('button', 'kv-b kv-step kv-next', ICON.next));
    prevBtn.type = nextBtn.type = 'button';
    prevBtn.setAttribute('aria-label', L.prev); nextBtn.setAttribute('aria-label', L.next);
    foot = dlg.appendChild(el('div', 'kv-foot'));
    capEl = foot.appendChild(el('div', 'kv-cap'));
    infoEl = foot.appendChild(el('div', 'kv-info'));
    msgEl = dlg.appendChild(el('div', 'kv-msg'));
    msgEl.setAttribute('role', 'status');
    msgEl.appendChild(el('div', 'kv-ring'));
    msgText = msgEl.appendChild(el('div', 'kv-t'));
    msgActs = msgEl.appendChild(el('div', 'kv-acts2'));
    msgEl.hidden = true;
    mapEl = dlg.appendChild(el('div', 'kv-map'));
    mapEl.setAttribute('aria-hidden', 'true');
    mapImg = mapEl.appendChild(el('img'));
    mapImg.alt = '';
    mapBox = mapEl.appendChild(el('i'));
    hintEl = dlg.appendChild(el('div', 'kv-hint'));
    hintEl.setAttribute('aria-hidden', 'true');
    hintEl.appendChild(el('span', 'kv-touch')).textContent = L.touch;
    hintEl.appendChild(el('span', 'kv-desk')).textContent = L.desk;

    xBtn.addEventListener('click', function () { close(); });
    prevBtn.addEventListener('click', function () { step(-1); });
    nextBtn.addEventListener('click', function () { step(1); });
    capEl.addEventListener('click', function () { capEl.classList.toggle('open'); });
    dlg.addEventListener('pointerdown', down);
    dlg.addEventListener('pointermove', move);
    dlg.addEventListener('pointerup', up);
    dlg.addEventListener('pointercancel', up);
    dlg.addEventListener('wheel', wheel, {passive: false});
    dlg.addEventListener('keydown', key);
    dlg.addEventListener('cancel', function (e) { e.preventDefault(); escape(); });
    // the close event of a close that an open right after already undid: not for kitLayer (it would shut the new one)
    dlg.addEventListener('close', function (e) { if (dlg.open) e.stopImmediatePropagation(); });
    dlg.addEventListener('contextmenu', function (e) { if (pointers.size > 1) e.preventDefault(); });
  }

  // ——— geometry: each slide's picture is laid out at its own size and moved by one transform ———
  function layout(s) {
    if (!s.w || !s.h) return;
    s.box.style.width = s.w + 'px';
    s.box.style.height = s.h + 'px';
    var vw = W(), vh = H(), contain = Math.min(vw / s.w, vh / s.h);
    if (S && S.o.upscale === false) contain = Math.min(contain, 1);
    var rest = contain;
    s.tall = false;
    // A tall screenshot drawn tiny: it rests at reading width, from its top.
    if (!s.video && s.h / s.w > 2.2 && contain * s.w < vw * 0.6) {
      rest = Math.min(vw, 900) / s.w;
      if (S && S.o.upscale === false) rest = Math.min(rest, 1);
      rest = Math.max(rest, contain);
      s.tall = rest > contain * 1.01;
    }
    s.contain = contain; s.rest = rest;
    s.min = Math.min(contain, rest);
    s.max = s.video ? rest : Math.max(rest, contain) * MAXZ;
    s.scale = rest;
    s.tx = (vw - s.w * rest) / 2;
    s.ty = s.tall ? 0 : (vh - s.h * rest) / 2;
    clamp(s); apply(s);
  }
  // keep the zoom across a resize: the same factor over rest, the same point in the middle
  function relayout(s) {
    if (!s.w) return;
    var f = s.scale / s.rest, vw0 = s.vw || W(), vh0 = s.vh || H();
    var cx = (vw0 / 2 - s.tx) / s.scale, cy = (vh0 / 2 - s.ty) / s.scale;
    layout(s);
    if (f > 1.02 || f < 0.98) {
      s.scale = Math.max(s.min, Math.min(s.max, s.rest * f));
      s.tx = W() / 2 - cx * s.scale; s.ty = H() / 2 - cy * s.scale;
      clamp(s); apply(s);
    }
  }
  function clamp(s) {
    var vw = W(), vh = H(), w = s.w * s.scale, h = s.h * s.scale;
    s.tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, s.tx));
    s.ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, s.ty));
    s.vw = vw; s.vh = vh;
  }
  function atRest(s) { return !s.w || Math.abs(s.scale - s.rest) / s.rest < 0.02; }
  function zoomed(s) { return !!s.w && s.scale > s.rest * 1.02; }
  function over(s, axis) { return !!s.w && (axis === 'x' ? s.w * s.scale > W() + 1 : s.h * s.scale > H() + 1); }
  function apply(s) {
    s.box.style.transform = 'translate(' + s.tx + 'px,' + s.ty + 'px) scale(' + s.scale + ')';
    if (s === cur() && dlg) {
      dlg.classList.toggle('kv-zoomed', zoomed(s));
      mapPaint(s);
      wantHi(s);
    }
  }
  function zoomTo(s, ns, cx, cy, glide) {
    if (!s.w || s.video) return;
    ns = Math.max(s.min, Math.min(s.max, ns));
    var fx = (cx - s.tx) / s.scale, fy = (cy - s.ty) / s.scale;
    if (glide && !reduce) {
      var s0 = s.scale, t0 = now(), id = ++anim;
      var tick = function () {
        if (id !== anim) return;
        var p = Math.min(1, (now() - t0) / 240), e = 1 - Math.pow(1 - p, 3);
        s.scale = s0 * Math.pow(ns / s0, e);
        s.tx = cx - fx * s.scale; s.ty = cy - fy * s.scale;
        clamp(s); apply(s);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      return;
    }
    s.scale = ns; s.tx = cx - fx * ns; s.ty = cy - fy * ns;
    clamp(s); apply(s);
  }
  function toRest(s, glide) {
    if (!s.w) return;
    if (glide && !reduce) {
      // glide to rest about the point that ends where rest puts it
      var vw = W(), vh = H(), r = s.rest;
      var tx = (vw - s.w * r) / 2, ty = s.tall ? Math.min(0, Math.max(vh - s.h * r, s.ty / s.scale * r)) : (vh - s.h * r) / 2;
      var k2 = 1 - r / s.scale;
      if (Math.abs(k2) > 1e-3) { zoomTo(s, r, (tx - s.tx * r / s.scale) / k2, (ty - s.ty * r / s.scale) / k2, true); return; }
    }
    s.scale = s.rest; s.tx = (W() - s.w * s.rest) / 2; s.ty = s.tall ? s.ty : (H() - s.h * s.rest) / 2;
    clamp(s); apply(s);
  }

  // ——— the overview: the whole picture, and the part on screen ———
  function mapPaint(s) {
    if (!mapEl) return;
    if (!zoomed(s) || !s.shown) { mapEl.classList.remove('on'); return; }
    var box = innerWidth < 600 ? 96 : 150, kk = Math.min(box / s.w, box / s.h);
    var mw = s.w * kk, mh = s.h * kk;
    mapEl.style.width = mw + 'px'; mapEl.style.height = mh + 'px';
    if (mapImg.getAttribute('src') !== s.shown) mapImg.src = s.shown;
    var z = kk / s.scale;
    var x0 = Math.max(0, -s.tx), y0 = Math.max(0, -s.ty);
    var x1 = Math.min(s.w * s.scale, W() - s.tx), y1 = Math.min(s.h * s.scale, H() - s.ty);
    mapBox.style.left = x0 * z + 'px'; mapBox.style.top = y0 * z + 'px';
    mapBox.style.width = (x1 - x0) * z + 'px'; mapBox.style.height = (y1 - y0) * z + 'px';
    mapEl.classList.add('on');
    hintEl.classList.remove('on');
    clearTimeout(mapTimer);
    mapTimer = setTimeout(function () { mapEl.classList.remove('on'); }, 1500);
  }

  // ——— loading: what the page already shows, then the file, then (zoomed) the sharp one ———
  function norm(it) {
    if (typeof it === 'string') return {src: it};
    if (it && it.nodeType === 1) return itemOf(it);
    return it || {};
  }
