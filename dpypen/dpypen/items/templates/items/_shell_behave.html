<script>
(function () {
  /* These selects were searchable in name only. Tom Select hides its typing
     input once the control holds an item, and the "— choose —" option counted
     as one, so the field never showed anywhere to type — and on a phone, with
     no keyboard up, there was no way to find that out. The search box now
     lives at the top of the open list, where it is always visible, and a
     required field keeps its empty option as a placeholder, not an item.

     A select with data-ranked-by="<field>" floats the options that
     data-ranks lists for the chosen value of that other field to the top,
     in the listed order, each tagged with how often it was used. A blank
     select also takes the first of them, so a pen that always wears the same
     nib does not make you pick it again — until you pick something else. */
  function wireRanking(ts) {
    var el = ts.input;
    var source = el.form && el.form.querySelector('select[name="' + el.dataset.rankedBy + '"]');
    if (!source) return;
    var ranks = {};
    try { ranks = JSON.parse(el.dataset.ranks || "{}"); } catch (e) {}
    var autoPicked = null;

    function rerank(pickTop) {
      var used = ranks[source.value] || [];
      var pos = {};
      used.forEach(function (pair, i) { pos[String(pair[0])] = { i: i, n: pair[1] }; });
      ts.clearOptionGroups();
      if (used.length) {
        ts.addOptionGroup("ranked", { label: el.dataset.rankedLabel || "Used before" });
        ts.addOptionGroup("rest", { label: el.dataset.restLabel || "Everything else" });
      }
      Object.keys(ts.options).forEach(function (value) {
        var hit = pos[value];
        ts.options[value].optgroup = used.length ? (hit ? "ranked" : "rest") : undefined;
        ts.options[value].rank = hit ? used.length - hit.i : 0;
        ts.options[value].uses = hit ? hit.n : 0;
      });
      // search() reuses its last result while the query is unchanged, which
      // it always is here — forget it, or the new ranks never get sorted.
      ts.lastQuery = null;
      ts.clearCache();
      ts.refreshOptions(false);
      var current = ts.getValue();
      if (pickTop && used.length && (!current || current === autoPicked)) {
        autoPicked = String(used[0][0]);
        ts.setValue(autoPicked, true);
      }
    }
    ts.on("change", function () { if (ts.getValue() !== autoPicked) autoPicked = null; });
    source.addEventListener("change", function () { rerank(true); });
    // On an edit the pen is already chosen: order the list, keep the nib.
    rerank(!ts.getValue());
  }

  function initTomSelect(root) {
    if (typeof TomSelect === "undefined") return;
    var ranked = [];
    (root || document).querySelectorAll("select.js-tom-select").forEach(function (el) {
      if (el.tomselect) return;
      var ts = new TomSelect(el, {
        allowEmptyOption: !el.required,
        maxOptions: 500,
        plugins: ["dropdown_input"],
        searchField: ["text"],
        sortField: [{ field: "rank", direction: "desc" }, { field: "$order" }],
        lockOptgroupOrder: true,
        render: {
          option: function (data, escape) {
            return '<div class="ts-opt">' + escape(data.text) +
              (data.uses ? '<span class="ts-uses">' + data.uses + '×</span>' : '') + '</div>';
          },
          optgroup_header: function (data, escape) {
            return '<div class="optgroup-header">' + escape(data.label) + '</div>';
          },
          no_results: function (data, escape) {
            return '<div class="no-results">Nothing matches “' + escape(data.input) + '”</div>';
          },
        },
      });
      // dropdown_input copies the field's placeholder ("— choose —") into
      // the search box, which then reads as one more thing to pick.
      ts.control_input.placeholder = "Type to search…";
      if (el.dataset.rankedBy) ranked.push(ts);
    });
    ranked.forEach(wireRanking);
  }
  // Initial load
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { initTomSelect(); });
  } else {
    initTomSelect();
  }
  // Re-init after hx-boost page swap or any htmx content swap
  // The whole page: after a boosted swap detail.target is the #main that was
  // replaced, out of the document, so the form's pickers never started.
  document.body.addEventListener("htmx:afterSettle", function () {
    initTomSelect();
  });
})();
</script>
<script>
(function () {
  var panel = document.getElementById("menuPanel");
  if (!panel) return;

  /* A stranger's corner button lives inside #main, which hx-boost replaces
     wholesale on every soft navigation, and the desk bar moves the tab bar's
     More in and out of the header. Holding a NodeList from page load bound a
     button once and lost it at the first swap. So: query at use time, and
     delegate the click. */
  function btns() {
    return Array.prototype.slice.call(document.querySelectorAll("[data-menu-btn]"));
  }

  /* The menu and the "⋯" panels are layers of the kit's (_layer.js): Back,
     Esc and a tap outside close them, focus goes back to the button. They are
     anchored and undimmed: the page keeps scrolling (lock: false) and focus
     stays on the button that opened them (focus: false). */
  function aria(sel, on) {
    Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) {
      b.setAttribute("aria-expanded", on ? "true" : "false");
    });
  }
  function closeMenu() {
    if (kitLayer.isOpen(panel)) kitLayer.close(panel);
  }
  function place(anchor) {
    // Anchor panel's right edge to the anchor button's right edge,
    // and top to the anchor's bottom + 8px.
    var r = anchor.getBoundingClientRect();
    var rightPx = Math.max(8, window.innerWidth - r.right);
    panel.style.right = rightPx + "px";
    /* The phone tab bar is fixed to the bottom of the screen, so anchoring
       the panel's top to the button's bottom edge put the whole panel below
       the viewport — "More" looked like a dead button. Anything sitting in
       the lower half of the screen gets bottom-anchored instead, opening
       upwards off the button. */
    if (r.top > window.innerHeight / 2) {
      panel.style.top = "auto";
      panel.style.bottom = (window.innerHeight - r.top + 8) + "px";
    } else {
      panel.style.bottom = "auto";
      // under the desk bar, as its other popovers are, not over its hairline
      var bar = anchor.closest("#hdr");
      panel.style.top = ((bar ? bar.getBoundingClientRect().bottom - 2 : r.bottom) + 8) + "px";
    }
  }
  function openMenu(anchor) {
    place(anchor);
    kitLayer.open(panel, {
      name: "menu", lock: false, focus: false,
      show: function () { panel.classList.add("open"); aria("[data-menu-btn]", true); },
      close: function () { panel.classList.remove("open"); aria("[data-menu-btn]", false); },
    });
  }
  function overflowOpen() { return document.querySelector(".overflow-panel.open"); }
  function closeOverflow() {
    var p = overflowOpen();
    if (p) kitLayer.close(p);
  }
  function openOverflow(btn) {
    var mine = btn.parentNode.querySelector(".overflow-panel");
    kitLayer.open(mine, {
      name: "overflow", lock: false, focus: false,
      show: function () { mine.classList.add("open"); btn.setAttribute("aria-expanded", "true"); },
      close: function () { mine.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); },
    });
  }

  /* One delegated listener on the document survives every swap. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-menu-btn]");
    if (btn) {
      e.stopPropagation();
      if (kitLayer.isOpen(panel)) closeMenu(); else openMenu(btn);
      return;
    }
    if (!panel.contains(e.target)) closeMenu();
  });
  /* Detail-page overflow menus ("⋯"). Delegated for the same reason the main
     menu is: these live inside #main, which hx-boost replaces wholesale on
     every soft navigation, so anything bound at load time is dead after the
     first one. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-overflow-btn]");
    var open = overflowOpen();
    if (btn) {
      e.stopPropagation();
      var mine = btn.parentNode.querySelector(".overflow-panel");
      if (open === mine) closeOverflow(); else openOverflow(btn);
      return;
    }
    if (open && !e.target.closest(".overflow-panel")) closeOverflow();
  });

  /* A form inside an open layer: the layer goes first (its entry with it),
     then the submit is replayed for htmx, so Back from the next page lands
     on this one and not on an open menu. A link is the kit's (v1.2 takes an
     hx-boosted link in the capture phase, before htmx's handler on it). */
  function layerOf(el) {
    var l = el.closest("#menuPanel, .overflow-panel, #ganttPopup, #deskSearch, #deskFilter");
    return l && kitLayer.isOpen(l) ? l : null;
  }
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.__replay) return;
    var l = layerOf(f);
    if (!l) return;
    e.preventDefault();
    e.stopPropagation();
    var by = e.submitter;
    kitLayer.close(l, function () {
      f.__replay = true;
      try { f.requestSubmit(by || undefined); } finally { f.__replay = false; }
    });
  }, true);
  /* A navigation that started some other way (a key, the search box) takes
     the menu with it. hx-boost replaces #main without a page load, so
     nothing else resets it. */
  document.body.addEventListener("htmx:beforeRequest", function () {
    closeMenu(); closeOverflow();
    var g = document.getElementById("ganttPopup");
    if (g && kitLayer.isOpen(g)) kitLayer.close(g);
  });
  window.addEventListener("resize", function () {
    if (kitLayer.isOpen(panel)) {
      var visibleBtn = btns().find(function (b) {
        var st = getComputedStyle(b);
        return b.offsetParent !== null && +st.opacity > 0 && st.pointerEvents !== "none";
      });
      if (visibleBtn) place(visibleBtn);
    }
  });

  /* Theme and keys moved to /settings/, which binds its own controls — it
     lives inside #main and so survives an hx-boost swap, which this script,
     running once outside it, would not. */
})();
</script>
<script>
/* The tab bar and the hamburger panel both live outside #main, which hx-boost
   swaps, so neither gets its current place back from the server — the
   panel was still lighting "Pens" after you had used it to navigate to
   Records. Re-derive both from the URL after every swap.

   The panel also disagreed with the server on hard loads: /pens/needs-photos/
   renders with nav="pens", so it lit "Pens" while sitting on the page its own
   entry names. Longest-prefix wins here, which resolves that too — and being
   derived rather than declared, it stays right for any route added later.

   The tab bar is the kit's (_tabs.html): kitTabs.set() lights the tab whose
   href or data-match is the longest start of the path, none when no tab owns
   the page. History and Records are desk-only tabs; on a phone those pages
   live behind More, so More is lit with them (as the server marks it). */
(function () {
  var panel = document.querySelector(".menu-panel");
  var links = panel ? Array.prototype.slice.call(panel.querySelectorAll(".menu-link, .menu-item")) : [];

  function syncMenu(here) {
    var best = null, bestLen = -1;
    links.forEach(function (a) {
      var href = (a.getAttribute("href") || "").split("?")[0];
      if (!href) return;
      // Longest matching prefix wins, so /pens/189/ lights Pens,
      // /pens/needs-photos/ lights its own entry rather than Pens, and the
      // dashboard's "/" never claims every page.
      if ((here === href || (href !== "/" && here.indexOf(href) === 0)) && href.length > bestLen) {
        best = a; bestLen = href.length;
      }
    });
    links.forEach(function (a) { a.classList.toggle("on", a === best); });
  }

  function syncTabs() {
    var nav = document.querySelector("nav.kit-tabs");
    if (!nav || !window.kitTabs) return;
    Array.prototype.forEach.call(nav.querySelectorAll(".kit-tab[aria-current]"), function (t) { t.removeAttribute("aria-current"); });
    kitTabs.set(location.href);
    var cur = nav.querySelector(".kit-tab[aria-current=page]"), more = nav.querySelector(".kit-tab[data-phone]");
    if (cur && more && cur.hasAttribute("data-desk")) more.setAttribute("aria-current", "page");
  }

  function sync() { syncMenu(location.pathname); syncTabs(); }

  sync();
  document.body.addEventListener("htmx:afterSettle", sync);
  document.body.addEventListener("htmx:pushedIntoHistory", sync);
  window.addEventListener("popstate", sync);
  /* Back from htmx's cache rewrites <body> from a snapshot taken on a desk
     with the nav inside the desk bar's slot: put it back where it lives (after
     #hdr) before the kit places it again, or a narrowed window keeps it in
     the hidden header. The panel's links are new nodes too. */
  document.addEventListener("htmx:historyRestore", function () {
    var nav = document.querySelector("nav.kit-tabs"), hdr = document.getElementById("hdr");
    if (nav && hdr && hdr.contains(nav)) hdr.parentNode.insertBefore(nav, hdr.nextSibling);
    panel = document.querySelector(".menu-panel");
    links = panel ? Array.prototype.slice.call(panel.querySelectorAll(".menu-link, .menu-item")) : [];
    if (window.kitTabs) kitTabs.mount();
    sync();
  });
})();
</script>
<script>
/* Group jump strip.
   /pens/ is 126 entries and /inks/ 136; even three columns deep that is metres
   of scroll with no way back to "Priority 1". Both list templates already mark
   their sections with [data-listnav-group] and head them with .group-head h3,
   so the strip can be derived rather than hand-maintained per page. */
(function () {
  var BUILT = "data-jumpbar-built";

  function build() {
    var host = document.querySelector("[data-listnav]");
    if (!host) return;
    var old = document.querySelector(".jumpbar");
    if (old) old.remove();

    /* Pens now carry a rotation filter bar and inks a colour swatch row, both
       of which name the same groups this strip would. Three stacked copies of
       one navigation was most of the first screen on a phone; where the page
       already navigates itself, the derived strip is pure duplication. */
    if (document.querySelector("#rotbar, #inkFilters")) return;

    var groups = Array.prototype.slice.call(
      host.querySelectorAll("[data-listnav-group]"));
    if (groups.length < 3) return;   // not worth the chrome

    var bar = document.createElement("nav");
    bar.className = "jumpbar";
    bar.setAttribute("aria-label", "Jump to group");
    bar.setAttribute(BUILT, "1");

    groups.forEach(function (g, i) {
      var h = g.querySelector(".group-head h3, .group-head h2");
      if (!h) return;
      if (!g.id) g.id = "grp-" + i;
      var a = document.createElement("a");
      a.href = "#" + g.id;
      a.textContent = h.textContent.trim();
      a.addEventListener("click", function (e) {
        e.preventDefault();
        g.scrollIntoView({ behavior: "smooth", block: "start" });
        history.replaceState(null, "", "#" + g.id);
      });
      bar.appendChild(a);
    });
    if (!bar.children.length) return;
    host.parentNode.insertBefore(bar, host);

    /* Light up whichever group owns the top of the viewport, and keep that
       chip scrolled into view inside the strip itself. */
    var chips = Array.prototype.slice.call(bar.children);
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var idx = groups.indexOf(en.target);
        if (idx < 0) return;
        chips.forEach(function (c, ci) { c.classList.toggle("on", ci === idx); });
        var chip = chips[idx];
        if (chip) {
          var l = chip.offsetLeft, r = l + chip.offsetWidth;
          if (l < bar.scrollLeft || r > bar.scrollLeft + bar.clientWidth) {
            bar.scrollTo({ left: l - 16, behavior: "smooth" });
          }
        }
      });
    }, { rootMargin: "-10% 0px -80% 0px", threshold: 0 });
    groups.forEach(function (g) { obs.observe(g); });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", build);
  } else { build(); }
  document.body.addEventListener("htmx:afterSettle", build);
  document.addEventListener("pypen:more", build);   // Load more added groups
})();
</script>
<script>
/* The keyboard layer navigates through this rather than location.href, so a
   jump keeps hx-boost's swap (and with it the scroll position and the tab
   state) instead of doing a full page load. */
window.__go = function (url, push) {
  // The palette's "What's new" entry opens the log, it is not a page.
  if (url === "#whatsnew") { if (window.kitWhatsNew) kitWhatsNew.open(); return; }
  // The new version (/next/, nextui): the palette's places and its hits are the
  // old addresses, one list for both shells; its shell says where each one lives.
  if (window.__nextUrl) url = window.__nextUrl(url);
  if (window.htmx && typeof htmx.ajax === "function") {
    /* HX-Boosted: the list views answer a bare HX-Request with a partial that
       has no #main in it, and swapping that in deleted #main — every palette
       jump to /pens/, /inks/ or /search/ left an empty page (found 2026-09-18).
       This is a whole-page navigation, so it says so. */
    htmx.ajax("GET", url, {target: "#main", select: "#main", swap: "outerHTML",
                           headers: {"HX-Boosted": "true"}})
      .then(function () {
        if (push !== false && location.pathname !== url) history.pushState(null, "", url);
        document.body.dispatchEvent(new CustomEvent("htmx:afterSettle"));
      })
      .catch(function () { location.href = url; });
    return;
  }
  location.href = url;
};
</script>
<script>
/* The list cursor (KEYS v1, ~/apps/kit/KEYS.md §2; contract in
   ~/apps/kit/README.md §6). One spec for the whole app, read again on every
   key, because hx-boost swaps #main and the list under the keys changes with
   it. The page marks the cursor (.kbd-focused); the layer walks and scrolls. */
(function () {
  var ITEMS = "#main [data-listnav-item], #main .list-row, #main article.inked, #main .rec";
  var ON = "kbd-focused";
  function cur() { return document.querySelector("#main ." + ON); }
  function drop() {
    var c = cur();
    if (c) c.classList.remove(ON);
    return !!c;
  }
  // The peer places of a page, most local first: rotation chips, ink colours,
  // history sections; failing those, the app's own tabs.
  function tabs() {
    var sets = [
      ["#rotbar .kit-chip", "aria-current", false],
      ["#inkFilters a[data-color]", "aria-current", true],      // a colour chip that is on clears itself
      [".history-sub-nav a", "active", false],
      ["#statsNav .kit-chip", "aria-current", false],
      ["#hdr nav.kit-tabs .kit-tab", "aria-current", false]      // the desk bar's tabs
    ];
    for (var i = 0; i < sets.length; i++) {
      var els = [].slice.call(document.querySelectorAll(sets[i][0]))
        .filter(function (el) { return el.offsetParent !== null; });
      if (els.length > 1) return { els: els, on: sets[i][1], toggle: sets[i][2] };
    }
    return null;
  }
  function peers(dir) {
    var t = tabs();
    if (!t) return;
    var at = -1;
    t.els.forEach(function (el, i) { if (t.on === "aria-current" ? /^(true|page)$/.test(el.getAttribute(t.on)) : el.classList.contains(t.on)) at = i; });
    var to = at + dir;
    if (t.toggle && to === -1 && at >= 0) { t.els[at].click(); return; }  // back to "all"
    if (to < 0 || to >= t.els.length) return;                             // clamp, no wrap
    t.els[to].click();
  }
  window.__keysList = function () {
    return {
      items: ITEMS,
      current: cur,
      select: function (el) { drop(); el.classList.add(ON); },
      open: function (el) {
        if (!el) return;
        var a = el.matches("a[href]") ? el
          : el.querySelector('a[href*="/pens/"], a[href*="/inks/"]') || el.querySelector("a[href]");
        if (a) a.click();
      },
      out: function () {
        if (drop()) return true;
        // on a pen or an ink (or a page under it), out is its list
        var m = location.pathname.match(/^\/(?:next\/)?(pens|inks|usages)\/[^/]+\//);
        if (m && window.__go) { window.__go("/" + m[1] + "/", true); return true; }
        return false;
      },
      peers: peers,
      header: function () {
        // the desk bar sticks over the top of the page; a phone has none
        var h = document.getElementById("hdr");
        return h && h.offsetParent !== null ? h.offsetHeight : 0;
      }
    };
  };
})();
</script>
